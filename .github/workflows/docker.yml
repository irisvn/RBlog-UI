# Builds the image ghcr.io/<owner>/rblog-ui on every push to main (tags :latest and :sha-<short>)
# and on a tag vX.Y.Z (:X.Y.Z), for linux/amd64 and linux/arm64, each on its own native runner.
#
# The repository needs the variables RBLOG_URL (https://cms.…) and SITE_URL (this site's public
# URL). No Content API key: the build never calls RBlog (GitHub's runners are refused by the CMS's
# Cloudflare anyway), and the first request after a deploy fills the pages (src/lib/rblog.ts).
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Build settings are present
        run: |
          missing=""
          [ -n "${{ vars.RBLOG_URL }}" ] || missing="$missing RBLOG_URL;"
          [ -n "${{ vars.SITE_URL }}" ] || missing="$missing SITE_URL;"
          if [ -n "$missing" ]; then
            echo "::error::Settings → Secrets and variables → Actions → Variables is missing:$missing"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/rblog-ui" >> "$GITHUB_ENV"
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            RBLOG_URL=${{ vars.RBLOG_URL }}
            SITE_URL=${{ vars.SITE_URL }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/rblog-ui"
          tags="-t $image:sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags="$tags -t $image:latest"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags="$tags -t $image:${GITHUB_REF_NAME#v}"; fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "TAGS=$tags" >> "$GITHUB_ENV"
      - name: Multi-platform manifest
        working-directory: /tmp/digests
        run: docker buildx imagetools create $TAGS $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}"
